name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run template:validate
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build & test inside Docker
        run: docker build --target test -t wedding-studio:test .
      - name: Build runtime image
        run: docker build --target runtime -t wedding-studio:ci .
      - name: Smoke test container
        run: |
          docker run -d --name ws -p 3000:3000 -e ADMIN_PASSWORD=ci-password-123 wedding-studio:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q "Hoàng Kim"
          docker logs ws
